[package]
name = "usuyo-api"
description = "usuyo 的本机 HTTP 接口和事件"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `server` 是接口本身；`client` 是找内核的一方核对对面是不是内核（桌面壳只要这一半，不链内核）。
[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:futures-util",
    "dep:jiff",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:url",
    "dep:usuyo-core",
    "dep:usuyo-plugin",
]
client = ["dep:serde_json", "dep:ureq"]

[dependencies]
axum = { version = "0.8.9", optional = true }
futures-util = { version = "0.3.34", optional = true }
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.42", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "fs", "io-util"], optional = true }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tokio-util = { version = "0.7.20", optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.7.1", features = ["cors", "fs", "set-header"], optional = true }
tracing = { version = "0.1.44", optional = true }
ureq = { version = "3.5.1", optional = true }
url = { version = "2.5.8", optional = true }
usuyo-core = { version = "0.0.0", path = "../usuyo-core", optional = true }
usuyo-plugin = { version = "0.0.0", path = "../usuyo-plugin", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
# 手机那一页的测试：假 release 服务器上的 tar.gz
flate2 = "1.1.11"
http-body-util = "0.1.5"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
