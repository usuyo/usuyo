[package]
name = "usuyo-plugin-kit"
description = "写 usuyo 插件用的：协议类型，获取插件的 HTTP 客户端（默认只连公网、只连声明过的主机），转换插件的 JSON-RPC 循环"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# socks-proxy：宿主交来 socks5 代理时经它连出去（目标的名字由代理查）
ureq = { version = "3.5.1", features = ["socks-proxy"] }
url = "2.5.8"
usuyo-plugin = { version = "0.0.0", path = "../usuyo-plugin", default-features = false }

[lints]
workspace = true

[dev-dependencies]
# 测试里起一个出示别的名字的证书的 TLS 服务，证明经代理的 https 被证书挡住
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
