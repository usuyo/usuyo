[package]
name = "usuyo-plugin-kit"
description = "写 usuyo 插件用的：协议类型，获取插件的 HTTP 客户端（默认只连公网、只连声明过的主机），转换插件的 JSON-RPC 循环"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
url = "2.5.8"
usuyo-plugin = { version = "0.0.0", path = "../usuyo-plugin", default-features = false }

[lints]
workspace = true
