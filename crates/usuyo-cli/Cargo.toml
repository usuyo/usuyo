[package]
name = "usuyo-cli"
description = "usuyo 命令行和守护进程"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "usuyo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.5.1"
usuyo-api = { version = "0.0.0", path = "../usuyo-api", features = ["client"] }
usuyo-core = { version = "0.0.0", path = "../usuyo-core" }
usuyo-library = { version = "0.0.0", path = "../usuyo-library" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
