[package]
name = "usuyo-core"
description = "usuyo 的引擎：资料库、索引、任务和插件串成一条线"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
imagesize = "0.15.0"
jiff = "0.2.42"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
usuyo-contract = { version = "0.0.0", path = "../usuyo-contract" }
usuyo-index = { version = "0.0.0", path = "../usuyo-index" }
usuyo-library = { version = "0.0.0", path = "../usuyo-library" }
usuyo-plugin = { version = "0.0.0", path = "../usuyo-plugin" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
