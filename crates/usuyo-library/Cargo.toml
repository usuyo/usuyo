[package]
name = "usuyo-library"
description = "usuyo 资料库：文件就是真相的那一层"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
usuyo-contract = { path = "../usuyo-contract" }
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
