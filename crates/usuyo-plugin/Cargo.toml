[package]
name = "usuyo-plugin"
description = "usuyo 插件协议的类型和获取插件的宿主"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
default = ["host"]
# 宿主：发现、启动、校验插件；插件作者关掉它只拿协议类型
host = [
    "dep:nix",
    "dep:tempfile",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:unicode-normalization",
    "dep:uuid",
]

[dependencies]
jiff = "0.2.42"
psl = "2.1.251"
schemars = "1.2.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "macros", "rt", "sync", "fs"], optional = true }
tokio-util = { version = "0.7.20", optional = true }
tracing = { version = "0.1.44", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"], optional = true }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
# `examples/kit_transform.rs`：用 plugin-kit 的循环写的转换插件，宿主的测试起它
usuyo-plugin-kit = { path = "../usuyo-plugin-kit" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
