# 协议 §3.9：读用户已经导出的文件，复用 list 和 fetch <ref>。
protocol: 1
id: usuyo-fetch/takeout
kind: fetch
name: Google Takeout
version: 1.0.0
license: MIT
maintainers: [someone]
platforms: [youtube]
methods:
  - id: takeout
    name: Takeout 文件
    access: official-export
    login: none
    account: none
    capabilities:
      list:
        order: unordered
        files: ["takeout-*.zip"]
        reads: Google Takeout 导出的 zip（选「YouTube 和 YouTube Music」）
      fetch:
        input: [ref]
        outputs: [text, meta]
permissions:
  fs:
    read: ["${INPUT}"]
    write: ["${OUT}"]
  network: {mode: none}
run:
  command: ["node", "${PLUGIN_DIR}/dist/main.js"]
requires:
  runtime: ["node>=22"]
