[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# 桌面壳自带工作区，接好以后再并进来。
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/usuyo/usuyo"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
