version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint # 错误必须用 %w 包装、用 errors.Is/As 比较（CLAUDE.md 代码约定）
    - exhaustive # switch 覆盖全部枚举值，契约里的 Kind/State 等依赖它
    - gocritic
    - misspell
    - nilerr
    - noctx # 网络请求必须带 context，配合超时要求
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/usuyo/usuyo
