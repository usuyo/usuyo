[package]
name = "usuyo-desktop"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# 自带工作区，根 Cargo.toml 已把本目录排除在外。
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
psl = "2.1.251"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
# `unstable`：登录窗口一个窗口里放两块网页（上面我们的一条，下面站点的页面），要 `Window::add_child`。
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2.7.3"
thiserror = "2.0.21"
ureq = "3.5.1"
# 只要握手的客户端一半，不链内核。
usuyo-api = { path = "../../../crates/usuyo-api", default-features = false, features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }
