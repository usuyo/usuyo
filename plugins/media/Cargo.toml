[package]
name = "usuyo-plugin-media"
description = "usuyo 预装的音视频转换插件：合起来能播、抽 16 kHz 音频、取关键帧，包着 ffmpeg 和 ffprobe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "usuyo-plugin-media"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
usuyo-plugin-kit = { path = "../../crates/usuyo-plugin-kit" }

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
usuyo-contract = { path = "../../crates/usuyo-contract" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# 独立的包：有自己的锁文件，不进仓库的工作区。
[workspace]
