# 预装的通用网页获取插件（协议 §8.4）：只读公开网页，不登录，没有站点专用规则。
protocol: 1
id: builtin/web
kind: fetch
name: 网页
description: 取公开网页的正文、图片和元数据
version: 0.0.0
license: MIT
maintainers: [usuyo]
platforms: [web]
match: ["*"]
methods:
  - id: page
    name: 公开网页
    access: public-web
    login: none
    account: none
    capabilities:
      fetch:
        outputs: [text, html, images, meta]
# 关着时（默认）只取公网网页；打开后，要取的那条链接本身可以是本机或内网地址，
# 例如自己的 NAS、内网 wiki、本机开发服务。页面里的图片和跳转去的地址仍然只取公网的。
settings:
  - key: allow-private-network
    label: 允许取内网网页
    type: bool
    default: false
permissions:
  fs:
    write: ["${OUT}"]
  network:
    mode: allowlist
    hosts: ["*"]
run:
  command: ["${PLUGIN_DIR}/usuyo-plugin-web"]
