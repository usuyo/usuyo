[package]
name = "usuyo-plugin-web"
description = "usuyo 预装的通用网页获取插件"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "usuyo-plugin-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dom_query = "0.29.0"
dom_smoothie = "0.19.0"
encoding_rs = "0.8.44"
jiff = "0.2.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
usuyo-plugin-kit = { version = "0.0.0", path = "../../crates/usuyo-plugin-kit" }

[lints]
workspace = true

[dev-dependencies]
encoding_rs = "0.8.44"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"
usuyo-plugin = { path = "../../crates/usuyo-plugin" }
