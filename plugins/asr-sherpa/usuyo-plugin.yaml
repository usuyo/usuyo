# 预装的口播转文字插件（协议 §2.9、feature 003 §4.1）：16 kHz 单声道 WAV 进，带时间点的 asr.vtt 出。
# 不联网：模型由宿主下到 ${MODELS}，VAD 随插件的资产带。
# vadThreshold（默认 0.5）、maxCueSec（默认 15）不是设置（设置的键只能是小写加 `-`，也没有小数类型），
# 只经 run 的 options 交进来，例如「再转一次」时。
protocol: 1
id: builtin/asr-sherpa
kind: transform
name: 口播转文字
description: silero VAD 切段，SenseVoice 转成带时间点的字
version: 0.1.0
license: MIT
maintainers: [usuyo]
upstream:
  - name: sherpa-onnx
    url: https://github.com/k2-fsa/sherpa-onnx
    license: Apache-2.0
  - name: silero-vad
    url: https://github.com/snakers4/silero-vad
    license: MIT
consumes: [audio:pcm16k]
produces: [asr]
provider: none
settings:
  - key: model
    label: 模型
    type: enum
    options: [sense-voice]
    default: sense-voice
  - key: language
    label: 语言
    type: enum
    options: [auto, zh, en, ja, ko, yue]
    default: auto
  - key: itn
    label: 标点和数字
    type: bool
    default: true
  - key: threads
    label: 线程数
    type: int
    default: 2
models:
  - name: sense-voice-int8-2024-07-17
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2
    sha256: 7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e
    size: 163002883
    format: tar.bz2
    license: FunASR Model Open Source License（可商用，署名并写明模型名）
    setting: model
    value: sense-voice
permissions:
  fs:
    read: ["${INPUT}", "${MODELS}"]
    write: ["${OUT}"]
  limits: {memory: 2GiB, timeout: 3600s}
run:
  command: ["${PLUGIN_DIR}/usuyo-plugin-asr-sherpa"]
